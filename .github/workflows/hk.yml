---
name: hk

on: # ryl disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@1990006622d3176e00fbf0d3d0b40723cfe8dbeb # v1.40.28
    permissions:
      contents: read
      packages: read
      statuses: write
