---
name: hk

on: # ryl disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@dd4f34cc761afa164ac5f8859b79cf62899d88f2 # v1.40.29
    permissions:
      contents: read
      packages: read
      statuses: write
