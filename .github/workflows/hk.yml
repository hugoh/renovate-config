---
name: hk

on: # ryl disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@7d30b69fa8ffc72ed90e3ba09aa2ff977ef6328e # v1.40.21
    permissions:
      contents: read
      packages: read
      statuses: write
